[project]
name = "bilingual-slm"
version = "0.1.0"
description = "Turkish-English small language model trained from scratch, plus a hand-written inference server."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.1",
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
data = ["pyarrow", "tokenizers", "huggingface_hub"]
train = ["huggingface_hub", "matplotlib"]
server = ["fastapi", "uvicorn", "tokenizers", "safetensors", "jinja2", "huggingface_hub"]
dev = ["pytest", "httpx", "transformers", "matplotlib"]  # transformers: reference for parity tests only

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["slm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
